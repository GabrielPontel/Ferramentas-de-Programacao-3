<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>usuario-listagem</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col> Id </ion-col>
      <ion-col> Nome </ion-col>
    </ion-row>
    @for (user of users; track $index) {
    <ion-row>
      <ion-col> {{user.id}} </ion-col>
      <ion-col> {{user.first_name}} </ion-col>
    </ion-row>
    }
  </ion-grid>

  <ion-list>
   @for (user of users; track $index) {
  <ion-item>
    <!-- <ion-avatar aria-hidden="true" slot="start">
      <img alt="" src={{user.avatar}} />
    </ion-avatar> -->
    <ion-label>{{user.first_name}}</ion-label>
  <ion-button (click)="remover(user.id)">Remover</ion-button>
  </ion-item>
}
</ion-list>
</ion-content>
