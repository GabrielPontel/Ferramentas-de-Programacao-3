<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>usuario-alteracao</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
 <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-input
          label="Primeiro Nome"
          formControlName="first_name"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Último Nome" formControlName="last_name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="E-mail" formControlName="email"></ion-input>
      </ion-item>
      <ion-button (click)="alterar()">Alterar</ion-button>
      <ion-button routerLink="/usuario-listagem">Cancelar</ion-button>
    </ion-list>
  </form>
</ion-content>
